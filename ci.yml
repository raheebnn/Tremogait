name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile Python sources
        run: python -m compileall -q raspberry_pi dashboard

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sketch: [hand_tremor, leg_gait]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: MPU9250_asukiaaa
            - name: MPU6050
          sketch-paths: firmware/${{ matrix.sketch }}
